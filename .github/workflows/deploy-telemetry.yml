name: Deploy Telemetry Jobs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_LOCATION: ${{ vars.GCP_ARTIFACT_REGION }}
      AR_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      TELEMETRY_RUNTIME_SERVICE_ACCOUNT: ${{ vars.TELEMETRY_RUNTIME_SERVICE_ACCOUNT }}
      TELEMETRY_SCHEDULER_SERVICE_ACCOUNT: ${{ vars.TELEMETRY_SCHEDULER_SERVICE_ACCOUNT }}
      CONSOLE_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CONSOLE_RUNTIME_SERVICE_ACCOUNT }}
      TRADER_SOURCE_LAYER_CONFIG: ${{ vars.TRADER_SOURCE_LAYER_CONFIG }}
      TRADER_RAG_PROVIDER: ${{ vars.TRADER_RAG_PROVIDER }}
      GOOGLE_AGENT_SEARCH_ENABLED: ${{ vars.GOOGLE_AGENT_SEARCH_ENABLED }}
      GOOGLE_SEARCH_CX: ${{ vars.GOOGLE_SEARCH_CX }}
      GOOGLE_SEARCH_API_KEY_SECRET: ${{ vars.GOOGLE_SEARCH_API_KEY_SECRET }}
      SPANNER_RAG_INSTANCE_ID: ${{ vars.SPANNER_RAG_INSTANCE_ID }}
      SPANNER_RAG_DATABASE_ID: ${{ vars.SPANNER_RAG_DATABASE_ID }}
      SPANNER_RAG_DOCUMENTS_TABLE: ${{ vars.SPANNER_RAG_DOCUMENTS_TABLE }}
      SPANNER_RAG_CHUNKS_TABLE: ${{ vars.SPANNER_RAG_CHUNKS_TABLE }}
      SPANNER_RAG_EMBEDDING_MODEL: ${{ vars.SPANNER_RAG_EMBEDDING_MODEL }}
      SPANNER_RAG_GCS_BUCKET: ${{ vars.SPANNER_RAG_GCS_BUCKET }}
      VERTEX_AI_SEARCH_DATA_STORE_ID: ${{ vars.VERTEX_AI_SEARCH_DATA_STORE_ID }}
      VERTEX_AI_SEARCH_ENGINE_ID: ${{ vars.VERTEX_AI_SEARCH_ENGINE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize deploy env
        run: |
          PROJECT_ID="${PROJECT_ID:-zenpulsar}"
          REGION="${REGION:-us-central1}"
          AR_LOCATION="${AR_LOCATION:-${REGION}}"
          AR_REPOSITORY="${AR_REPOSITORY:-mutual-spec}"
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/mutual-spec-agent:${IMAGE_TAG}"
          echo "PROJECT_ID=${PROJECT_ID}" >> "${GITHUB_ENV}"
          echo "REGION=${REGION}" >> "${GITHUB_ENV}"
          echo "AR_LOCATION=${AR_LOCATION}" >> "${GITHUB_ENV}"
          echo "AR_REPOSITORY=${AR_REPOSITORY}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
          echo "GOOGLE_CLOUD_PROJECT=${PROJECT_ID}" >> "${GITHUB_ENV}"
          echo "GOOGLE_CLOUD_LOCATION=${REGION}" >> "${GITHUB_ENV}"
          echo "TELEMETRY_DATASET_ID=telemetry" >> "${GITHUB_ENV}"
          echo "TELEMETRY_LOCATION=US" >> "${GITHUB_ENV}"
          echo "GCP_ASSET_CHANGES_TOPIC=gcp-all-resource-changes" >> "${GITHUB_ENV}"
          echo "GCP_ASSET_CHANGES_SUBSCRIPTION=gcp-all-resource-changes-sub" >> "${GITHUB_ENV}"
          echo "POWER_PRICE_SOURCE=static_region_power_map" >> "${GITHUB_ENV}"
          echo "TRADER_SOURCE_LAYER_CONFIG=${TRADER_SOURCE_LAYER_CONFIG:-config/trader_source_layer.yaml}" >> "${GITHUB_ENV}"
          echo "TRADER_RAG_PROVIDER=${TRADER_RAG_PROVIDER:-spanner_rag}" >> "${GITHUB_ENV}"
          echo "GOOGLE_AGENT_SEARCH_ENABLED=${GOOGLE_AGENT_SEARCH_ENABLED:-true}" >> "${GITHUB_ENV}"
          echo "GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX:-}" >> "${GITHUB_ENV}"
          echo "GOOGLE_SEARCH_API_KEY_SECRET=${GOOGLE_SEARCH_API_KEY_SECRET:-}" >> "${GITHUB_ENV}"
          echo "SPANNER_RAG_INSTANCE_ID=${SPANNER_RAG_INSTANCE_ID:-commodity-rag}" >> "${GITHUB_ENV}"
          echo "SPANNER_RAG_DATABASE_ID=${SPANNER_RAG_DATABASE_ID:-trader_rag}" >> "${GITHUB_ENV}"
          echo "SPANNER_RAG_DOCUMENTS_TABLE=${SPANNER_RAG_DOCUMENTS_TABLE:-RagDocuments}" >> "${GITHUB_ENV}"
          echo "SPANNER_RAG_CHUNKS_TABLE=${SPANNER_RAG_CHUNKS_TABLE:-RagChunks}" >> "${GITHUB_ENV}"
          echo "SPANNER_RAG_EMBEDDING_MODEL=${SPANNER_RAG_EMBEDDING_MODEL:-RagEmbeddingModel}" >> "${GITHUB_ENV}"
          echo "SPANNER_RAG_GCS_BUCKET=${SPANNER_RAG_GCS_BUCKET:-zenpulsar-spanner-rag-ingest}" >> "${GITHUB_ENV}"
          echo "VERTEX_AI_SEARCH_DATA_STORE_ID=${VERTEX_AI_SEARCH_DATA_STORE_ID:-}" >> "${GITHUB_ENV}"
          echo "VERTEX_AI_SEARCH_ENGINE_ID=${VERTEX_AI_SEARCH_ENGINE_ID:-}" >> "${GITHUB_ENV}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry Docker auth
        run: gcloud auth configure-docker "${AR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build image
        run: docker build -t "${IMAGE_URI}" .

      - name: Push image
        run: docker push "${IMAGE_URI}"

      - name: Deploy Cloud Run Jobs
        run: bash deploy/cloud-run/deploy_telemetry_jobs.sh

      - name: Deploy Console Service
        run: bash deploy/cloud-run/deploy_console_service.sh

      - name: Configure Cloud Scheduler
        run: bash deploy/cloud-run/create_telemetry_schedules.sh

      - name: Initialize telemetry tables
        run: >
          gcloud run jobs execute mutual-spec-telemetry-init-tables
          --region="${REGION}"
          --project="${PROJECT_ID}"
          --wait

      - name: Install telemetry views
        run: >
          gcloud run jobs execute mutual-spec-telemetry-install-views
          --region="${REGION}"
          --project="${PROJECT_ID}"
          --wait

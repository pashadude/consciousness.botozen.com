[project]
name = "mutual-spec-agent"
version = "0.1.0"
description = "ADK Python 2.x Mutual Specification Game prototype"
authors = [{ name = "Mutual Spec Agent" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[agent-engines,evaluation]>=1.150.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "mcp>=1.20.0,<2.0.0",
]

[project.scripts]
mutual-spec-dashboard = "app.cli_dashboard:main"
mutual-spec-jobs = "app.jobs_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[project.optional-dependencies]
cloud-run = [
    "uvicorn>=0.32.0,<1.0.0",
]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
